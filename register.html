<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · Smart Mandi</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
  <header class="top">
    <a class="brand" href="index.html"><span class="logo">M</span>Smart Mandi</a>
    <nav id="nav"></nav>
  </header>
  <div id="flash"></div>
  <main>
  <section class="phone narrow">
    <h1>Create farmer account</h1>
    <form id="regForm">
      <label>Full name<input id="name" required></label>
      <label>Phone number<input id="phone" inputmode="numeric" maxlength="10" required></label>
      <label>Village<input id="village"></label>
      <label>District<input id="district" placeholder="e.g. Warangal"></label>
      <label>Password (6+ characters)<input id="password" type="password" minlength="6" required></label>
      <button class="btn wide" type="submit">Create account</button>
    </form>
    <p class="muted">Already registered? <a href="login.html">Log in</a></p>
  </section>
  </main>
  <footer>Prices shown are demo data, not live government prices.</footer>
  <script src="app.js"></script>
</body>
</html>
